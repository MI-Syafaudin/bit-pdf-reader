[workspace]
resolver = "2"
members = [
    "crates/pdfx-core",
    "crates/pdfx-engine",
    "crates/pdfx-storage",
    "crates/pdfx-ocr",
    "crates/pdfx-cli",
    "crates/pdfx-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["MI_Syafaudin <https://github.com/MI-Syafaudin>", "Noble PDF Reader Contributors"]
license = "Apache-2.0"
repository = "https://github.com/MI-Syafaudin/noble-pdf-reader"
homepage = "https://github.com/MI-Syafaudin/noble-pdf-reader"


[workspace.dependencies]
pdfx-core = { path = "crates/pdfx-core" }
pdfx-engine = { path = "crates/pdfx-engine" }
pdfx-storage = { path = "crates/pdfx-storage" }
pdfx-ocr = { path = "crates/pdfx-ocr" }
pdfx-tui = { path = "crates/pdfx-tui" }

thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
directories = "5.0"
tempfile = "3.12"
crossbeam-channel = "0.5"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
ratatui = { version = "0.28", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
lopdf = "0.34"
pdfium-render = "0.8"
clap_complete = "4.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
